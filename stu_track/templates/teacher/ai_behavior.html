<!DOCTYPE html>
<html>
<head>
    <title>AI Behavior Detection | TrackSmart</title>

    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #f4f7fc;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🤖 AI Behavior Detection</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <label>Select Student:</label>

        <select name="student" required>

            {% for student in students %}

                <option value="{{ student.id }}">
                    {{ student.full_name }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Upload Classroom Image:</label>

        <input type="file"
               name="image"
               accept="image/*"
               required>

        <br><br>

        <button type="submit">
            🤖 Predict Behavior
        </button>

    </form>


    {% if prediction %}

        <div class="result">

            <h3>Predicted Behavior</h3>

            <h2>{{ prediction }}</h2>

        </div>

    {% endif %}


    <a href="{% url 'dashboard' %}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>

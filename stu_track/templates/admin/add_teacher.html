<!DOCTYPE html>
<html>
<head>
    <title>Add Teacher | TrackSmart</title>

    <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Segoe UI,sans-serif;
    }

    body{
        background:#f4f7fc;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        width:600px;
        background:white;
        padding:40px;
        border-radius:15px;
        box-shadow:0 5px 20px rgba(0,0,0,0.15);
    }

    h2{
        text-align:center;
        color:#1565c0;
        margin-bottom:30px;
    }

    .form-group{
        margin-bottom:18px;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-weight:600;
        color:#444;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:15px;
    }

    button{
        width:100%;
        padding:14px;
        border:none;
        background:#1565c0;
        color:white;
        font-size:16px;
        font-weight:bold;
        border-radius:8px;
        cursor:pointer;
        margin-top:10px;
    }

    button:hover{
        background:#0d47a1;
    }

    </style>

</head>
<body>

<div class="container">

    <h2>Add Teacher</h2>

    <form method="POST">

        {% csrf_token %}
        <div class="form-group">

            <label>Teacher ID</label>

            <input type="text"
                name="teacher_id"
                required>

        </div>

        <div class="form-group">
            <label>Teacher Name</label>

            <input type="text"
                   name="name"
                   required>
        </div>

        <div class="form-group">
            <label>Subject</label>

            <input type="text"
                   name="subject"
                   required>
        </div>

        <div class="form-group">
            <label>Class Assigned</label>

            <input type="text"
                   name="class_assigned"
                   required>
        </div>

        <div class="form-group">
            <label>Salary</label>

            <input type="number"
                   name="salary"
                   required>
        </div>

        <button type="submit">
            Add Teacher
        </button>

    </form>

</div>

</body>
</html>

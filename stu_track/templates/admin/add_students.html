<!DOCTYPE html>
<html>
<head>
    <title>Add Student | TrackSmart</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:700px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#1565c0;
            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
            color:#444;
        }

        input,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        .row{
            display:flex;
            gap:15px;
        }

        .row .form-group{
            flex:1;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            background:#1565c0;
            color:white;
            font-size:16px;
            font-weight:bold;
            border-radius:8px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#0d47a1;
        }

    </style>

</head>
<body>

<div class="container">

    <h2>🎓 Add New Student</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Student Full Name</label>
            <input type="text" name="full_name" required>
        </div>

        <div class="row">

            <div class="form-group">
                <label>Father Name</label>
                <input type="text" name="father_name" required>
            </div>

            <div class="form-group">
                <label>Mother Name</label>
                <input type="text" name="mother_name" required>
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <div class="form-group">
                <label>Roll Number</label>
                <input type="text" name="roll_number" required>
            </div>

        </div>

        <div class="row">

            <div class="form-group">
                <label>Class / Department</label>
                <input type="text" name="department" required>
            </div>

            <div class="form-group">
                <label>Fee Status</label>
                <select name="fee_status">
                    <option value="Paid">Paid</option>
                    <option value="Unpaid">Unpaid</option>
                </select>
            </div>

        </div>

        <button type="submit">
            Add Student
        </button>

    </form>

</div>

</body>
</html>

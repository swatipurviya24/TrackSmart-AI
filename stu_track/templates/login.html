<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TrackSmart AI - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
            overflow:hidden;
        }

        .background-circles{
            position:absolute;
            width:100%;
            height:100%;
            overflow:hidden;
            z-index:0;
        }

        .circle{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.08);
            animation: float 8s infinite ease-in-out;
        }

        .circle:nth-child(1){
            width:200px;
            height:200px;
            top:10%;
            left:5%;
        }

        .circle:nth-child(2){
            width:300px;
            height:300px;
            bottom:-50px;
            right:10%;
        }

        .circle:nth-child(3){
            width:150px;
            height:150px;
            top:60%;
            left:20%;
        }

        @keyframes float{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        .login-container{
            position:relative;
            z-index:2;
            width:420px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;
            padding:40px;
            box-shadow:0 8px 32px rgba(0,0,0,0.25);
            color:white;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            text-align:center;
            margin-bottom:10px;
        }

        .logo i{
            font-size:55px;
            color:#93c5fd;
        }

        .project-title{
            text-align:center;
            font-size:34px;
            font-weight:700;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:#dbeafe;
            margin-bottom:30px;
            font-size:14px;
        }

        .form-label{
            font-weight:500;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group-text{
            background:rgba(255,255,255,0.15);
            border:none;
            color:white;
        }

        .form-control,
        .form-select{
            background:rgba(255,255,255,0.15);
            border:none;
            color:white;
            padding:12px;
        }

        .form-control::placeholder{
            color:#e5e7eb;
        }

        .form-control:focus,
        .form-select:focus{
            box-shadow:none;
            border:1px solid #93c5fd;
            background:rgba(255,255,255,0.18);
            color:white;
        }

        .form-select option{
            color:black;
        }

        .btn-login{
            width:100%;
            padding:12px;
            border:none;
            border-radius:12px;
            background:#3b82f6;
            color:white;
            font-weight:600;
            font-size:16px;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#2563eb;
            transform:translateY(-2px);
        }

        .extra-links{
            margin-top:18px;
            text-align:center;
            font-size:14px;
        }

        .extra-links a{
            color:#bfdbfe;
            text-decoration:none;
            font-weight:600;
        }

        .extra-links a:hover{
            color:white;
        }

        .error-message{
            text-align:center;
            color:#fecaca;
            margin-top:15px;
            font-size:14px;
        }

    </style>
</head>

<body>

    <!-- Background Design -->
    <div class="background-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Login Card -->
    <div class="login-container">

        <div class="logo">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <div class="project-title">
            TrackSmart AI
        </div>

        <div class="subtitle">
            AI-Based Student Behavior & Attendance System
        </div>

        <form method="POST">

            {% csrf_token %}

            <!-- Username -->
            <label class="form-label">Username</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>

                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username"
                       required>
            </div>

            <!-- Password -->
            <label class="form-label">Password</label>

            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>

                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>
            </div>

            <!-- Role -->
            <label class="form-label">Login As</label>

            <select name="role" class="form-select mb-4" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
                
                
            </select>

            <!-- Button -->
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </button>

        </form>

        <!-- Signup -->
        <div class="extra-links">
            Don’t have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </div>

        <!-- Error -->
        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

    </div>

</body>
</html>

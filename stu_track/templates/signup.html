<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackSmart - Sign Up</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f4c81,#2563eb);
        }

        .container{
            width:420px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .logo{
            text-align:center;
            margin-bottom:10px;
            font-size:32px;
            font-weight:bold;
            color:#2563eb;
        }

        .subtitle{
            text-align:center;
            color:gray;
            margin-bottom:30px;
            font-size:14px;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:15px;
            outline:none;
            transition:0.3s;
            color:black;
            background:white;
        }

        .input-box input:focus,
        .input-box select:focus{
            border-color:#2563eb;
            box-shadow:0 0 5px rgba(37,99,235,0.4);
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .bottom-text a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

        .error{
            background:#ffe5e5;
            color:red;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="logo">TrackSmart</div>

    <div class="subtitle">
        AI Powered Student Management System
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="input-box">
            <input type="text" name="fullname" placeholder="Enter Full Name" required>
        </div>

        <div class="input-box">
            <input type="text" name="username" placeholder="Choose Username" required>
        </div>

        <div class="input-box">
            <input type="email" name="email" placeholder="Enter Email" required>
        </div>

        <div class="input-box">
            <input type="password" name="password" placeholder="Create Password" required>
        </div>

        <div class="input-box">
            <select name="role">
    <option value="student">Student</option>
</select>
        </div>

        <button type="submit" class="btn">
            Create Account
        </button>

    </form>

    <div class="bottom-text">
        Already have an account?
        <a href="/">Login</a>
    </div>

</div>

</body>
</html>

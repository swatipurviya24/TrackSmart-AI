<!DOCTYPE html>
<html>
<head>
    <title>My Attendance | TrackSmart</title>

    <style>

    body{
        font-family:Segoe UI,sans-serif;
        background:#f4f7fc;
        padding:30px;
    }

    .container{
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.08);
    }

    h2{
        color:#1e3a8a;
        margin-bottom:25px;
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th{
        background:#2563eb;
        color:white;
        padding:12px;
        text-align:left;
    }

    td{
        padding:12px;
        border-bottom:1px solid #ddd;
    }

    .present{
        color:green;
        font-weight:bold;
    }

    .absent{
        color:red;
        font-weight:bold;
    }

    </style>
</head>

<body>

<div class="container">

    <h2>📅 My Attendance</h2>

    <table>

        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for record in attendance %}

        <tr>

            <td>
                {{ record.date }}
            </td>

            <td>

                {% if record.status == 'Present' %}

                    <span class="present">
                        Present
                    </span>

                {% else %}

                    <span class="absent">
                        Absent
                    </span>

                {% endif %}

            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="2">
                No attendance records found.
            </td>
        </tr>

        {% endfor %}

    </table>
    <a href="{% url 'student_dashboard' %}"
   style="
       display:block;
       margin-top:20px;
       text-align:center;
       color:#2563eb;
       text-decoration:none;
       font-weight:600;
   ">
    ← Back to Dashboard
</a>

</div>

</body>
</html>
